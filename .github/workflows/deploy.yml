name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check and build
        run: npm run check

      - name: Add custom domain
        run: cp CNAME build/CNAME

      - name: Verify export
        run: |
          test -f build/index.html
          test -f build/projectsfile
          test -f build/project-media/winxp-portfolio.webp
          test -f build/project-media/aim-assist.webp
          test -f build/project-media/ambilight.webp
          test -f build/wallpaper/windows-xp-bliss.jpg
          test -f build/CNAME
          grep -q "Elio Koka" build/index.html
          grep -q "Windows XP Inspired Personal Site" build/projectsfile
          grep -q "Computer Vision for Real-Time Aim Assist" build/projectsfile
          grep -q "WS2815 addressable LED strips" build/projectsfile
          grep -q "kokael.io" build/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
